name: Build Cal.diy images

# Builds calcom/cal.diy (MIT) from source at a pinned commit and pushes the
# images to GHCR. Cal.diy publishes no images of its own, and the build needs
# 6-16 GB of memory, so it never runs on the droplet that serves it.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "calcom/cal.diy commit SHA or branch to build"
        required: true
        default: "main"
      webapp_url:
        description: "Public URL the web app is served at (baked into the build)"
        required: true
        default: "https://cal.tipline.ai"
      app_name:
        description: "Product name shown in page titles and emails (NEXT_PUBLIC_APP_NAME, baked into the build)"
        required: true
        default: "Tipline Scheduling"
      privacy_url:
        description: "Privacy policy the booking form links to (NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL, baked into the build)"
        required: true
        default: "https://impact11.com/privacy/"
      build_api_v2:
        description: "Also build the API v2 image"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  PG_URL: postgresql://unicorn_user:magical_password@localhost:5432/calendso

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unicorn_user
          POSTGRES_PASSWORD: magical_password
          POSTGRES_DB: calendso
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
        with:
          repository: calcom/cal.diy
          ref: ${{ inputs.upstream_ref }}
          path: src
      - uses: actions/checkout@v4
        with:
          path: self
      # The tag names both inputs: upstream commit + this repo's commit (the branding).
      - id: meta
        run: |
          echo "sha=$(git -C src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$(git -C src rev-parse --short=12 HEAD)-b$(git -C self rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      # Tipline icons replace Cal.diy's in apps/web/public (favicons, touch and tile icons,
      # the in-app icon SVG, the web manifest, and emails/logo.png, the wordmark at the foot
      # of every email, which upstream ships as a "Cal.diy" image). The upstream Dockerfile declares no
      # NEXT_PUBLIC_APP_NAME build arg, so add one to its builder stage; turbo.json already
      # passes that variable through to the Next.js build.
      #
      # NEXT_PUBLIC_APP_NAME only reaches code that reads APP_NAME. "Cal.diy" is also
      # hard-coded in the login heading, the logo's alt/title, the email-embed "Powered by"
      # line, and ~1,160 translated strings (every language, used by pages and emails), so
      # those are rewritten to the app name too. Each count is asserted, so an upstream
      # change fails the build instead of silently showing "Cal.diy" again.
      - name: Apply Tipline branding
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          case "$APP_NAME" in *[/\&\|\\\"]*) echo "app_name must not contain / & | \\ or \""; exit 1;; esac
          cp -rv self/branding/public/. src/apps/web/public/
          cmp self/branding/public/emails/logo.png src/apps/web/public/emails/logo.png
          sed -i '0,/^WORKDIR \/calcom$/s//WORKDIR \/calcom\nARG NEXT_PUBLIC_APP_NAME\nENV NEXT_PUBLIC_APP_NAME=$NEXT_PUBLIC_APP_NAME/' src/Dockerfile
          grep -n -A2 '^WORKDIR /calcom$' src/Dockerfile | head -4
          grep -q '^ENV NEXT_PUBLIC_APP_NAME=\$NEXT_PUBLIC_APP_NAME$' src/Dockerfile

          F=src/apps/web/modules/auth/login-view.tsx
          test "$(grep -c '>Cal\.diy</h1>' $F)" = 1
          sed -i "s|>Cal\.diy</h1>|>${APP_NAME}</h1>|" $F

          F=src/packages/ui/components/logo/Logo.tsx
          test "$(grep -o '"Cal\.diy"' $F | wc -l)" = 4
          sed -i "s|\"Cal\.diy\"|\"${APP_NAME}\"|g" $F

          F=src/apps/web/modules/embed/components/Embed.tsx
          test "$(grep -c '<span> Cal\.diy</span>' $F)" = 1
          sed -i "s|<span> Cal\.diy</span>|<span> ${APP_NAME}</span>|" $F

          L=src/packages/i18n/locales
          echo "translated strings mentioning Cal.diy: $(cat $L/*/common.json | grep -o 'Cal\.diy' | wc -l)"
          sed -i "s|Cal\.diy|${APP_NAME}|g" $L/*/common.json
          test "$(cat $L/*/common.json | grep -c 'Cal\.diy')" = 0
          for f in $L/*/common.json; do python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$f"; done
          grep -n "\"sign_in_to_cal_com\"" $L/en/common.json
      # Cal.diy creates, updates and deletes Google Calendar events with sendUpdates "none"
      # (it emails guests itself), so guests never get Google's invite, reschedule or
      # cancellation. nimo wants Google's invites (2026-11-19): flip all three to "all".
      # Fails the build if upstream changes the count, so the patch never silently lapses.
      - name: Send Google Calendar invites to guests
        run: |
          F=src/packages/app-store/googlecalendar/lib/CalendarService.ts
          test "$(grep -c 'sendUpdates: "none"' $F)" = 3
          sed -i 's/sendUpdates: "none"/sendUpdates: "all"/; s/sendNotifications: false,/sendNotifications: true,/' $F
          test "$(grep -c 'sendUpdates: "all"' $F)" = 3
          test "$(grep -c 'sendUpdates: "none"' $F)" = 0
          grep -n 'sendUpdates\|sendNotifications' $F
      # Tipline's look and links (nimo, 2026-11-19), so the calendar embedded on tipline.ai matches the site:
      # - no rounded corners: Cal's Button and ToggleGroup hard-code rounded-[10px], which the embed's CSS
      #   variables cannot reach, so one global rule squares everything except rounded-full (avatars, dots,
      #   switches, radios);
      # - Plus Jakarta Sans instead of Inter (and ahead of Cal Sans for headings);
      # - the booking form's legal line names only the privacy policy (Tipline has no terms page);
      # - the "Google's new spam policy" warning for Gmail guests is off: it links a cal.com blog post, and
      #   here the invite comes from Google itself.
      # Every count is asserted, so an upstream change fails the build.
      - name: Apply Tipline style
        run: |
          F=src/apps/web/styles/globals.css
          test "$(grep -c 'border-radius:0!important' $F)" = 0
          printf '\n/* Tipline: no rounded corners (cal-diy-build) */\n*:not(.rounded-full){border-radius:0!important}\n' >> $F

          for F in src/apps/web/app/layout.tsx src/apps/web/components/PageWrapper.tsx; do
            test "$(grep -c '^import { Inter } from "next/font/google";$' $F)" = 1
            test "$(grep -c '^const interFont = Inter({' $F)" = 1
            test "$(grep -c -- '--font-cal: ${calFont.style.fontFamily' $F)" = 1
            sed -i 's|^import { Inter } from "next/font/google";$|import { Plus_Jakarta_Sans } from "next/font/google";|; s|^const interFont = Inter({|const interFont = Plus_Jakarta_Sans({|; s|--font-cal: ${calFont.style.fontFamily|--font-cal: ${interFont.style.fontFamily.replace(/\x27/g, "")}, ${calFont.style.fontFamily|' $F
            grep -n 'Plus_Jakarta_Sans\|--font-cal:' $F
          done

          F=src/packages/i18n/locales/en/common.json
          test "$(grep -c '"signing_up_terms": "By proceeding, you agree to .*<0>Terms</0> and <1>Privacy Policy</1>\."' $F)" = 1
          sed -i 's|"signing_up_terms": "By proceeding, you agree to .*<0>Terms</0> and <1>Privacy Policy</1>\."|"signing_up_terms": "By proceeding, you agree to Tipline\x27s <1>Privacy Policy</1>."|' $F
          grep -n '"signing_up_terms"' $F
          python3 -c 'import json,sys; json.load(open(sys.argv[1]))' $F

          F=src/apps/web/modules/bookings/views/bookings-single-view.tsx
          test "$(grep -c 'const isGmail = !!attendees.find((attendee) => attendee?.email?.includes("gmail.com"));' $F)" = 1
          sed -i 's|const isGmail = !!attendees.find((attendee) => attendee?.email?.includes("gmail.com"));|const isGmail = process.env.NEXT_PUBLIC_SHOW_GMAIL_SPAM_NOTICE === "1" \&\& !!attendees.find((attendee) => attendee?.email?.includes("gmail.com"));|' $F
          grep -n 'const isGmail' $F
      # tipline.ai shows the calendar in half the page (about 520px), and nimo wants the day's times beside the
      # month without a second click (2026-11-20). Upstream switches to its one-column phone layout under 768px;
      # patches/narrow_booker.py moves that to 480px and narrows the times column to fit. Phones are unchanged.
      # Scrollbars are thin with a clear track, so a system that always shows them leaves no empty strip.
      - name: Dates and times side by side from 480px
        working-directory: src
        run: |
          python3 ../self/patches/narrow_booker.py
          F=apps/web/styles/globals.css
          test "$(grep -c 'scrollbar-color:#3A3D45 transparent' $F)" = 0
          printf '\n/* Tipline: thin scrollbars, clear track (cal-diy-build) */\nhtml{scrollbar-width:thin;scrollbar-color:#3A3D45 transparent}\n' >> $F
          tail -5 $F
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web image
        working-directory: src
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/cal-diy-web
          docker build --network host \
            --build-arg "NEXT_PUBLIC_APP_NAME=${{ inputs.app_name }}" \
            --build-arg NEXT_PUBLIC_WEBAPP_URL=${{ inputs.webapp_url }} \
            --build-arg NEXT_PUBLIC_API_V2_URL=${{ inputs.webapp_url }}/api/v2 \
            --build-arg NEXT_PUBLIC_LICENSE_CONSENT=agree \
            --build-arg "NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL=${{ inputs.privacy_url }}" \
            --build-arg "NEXT_PUBLIC_WEBSITE_TERMS_URL=${{ inputs.privacy_url }}" \
            --build-arg CALCOM_TELEMETRY_DISABLED=1 \
            --build-arg DATABASE_URL=$PG_URL \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ steps.meta.outputs.sha }} \
            -t $IMG:${{ steps.meta.outputs.tag }} -t $IMG:latest .
          docker image ls $IMG
          docker push $IMG:${{ steps.meta.outputs.tag }}
          docker push $IMG:latest

  api-v2:
    if: ${{ inputs.build_api_v2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
        with:
          repository: calcom/cal.diy
          ref: ${{ inputs.upstream_ref }}
          path: src
      - id: meta
        run: echo "sha=$(git -C src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API v2 image
        working-directory: src
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/cal-diy-api-v2
          docker build -f apps/api/v2/Dockerfile \
            --build-arg DATABASE_URL=$PG_URL --build-arg DATABASE_DIRECT_URL=$PG_URL \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ steps.meta.outputs.sha }} \
            -t $IMG:${{ steps.meta.outputs.sha }} -t $IMG:latest .
          docker image ls $IMG
          docker push $IMG:${{ steps.meta.outputs.sha }}
          docker push $IMG:latest
