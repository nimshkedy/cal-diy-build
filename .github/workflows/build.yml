name: Build Cal.diy images

# Builds calcom/cal.diy (MIT) from source at a pinned commit and pushes the
# images to GHCR. Cal.diy publishes no images of its own, and the build needs
# 6-16 GB of memory, so it never runs on the droplet that serves it.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "calcom/cal.diy commit SHA or branch to build"
        required: true
        default: "main"
      webapp_url:
        description: "Public URL the web app is served at (baked into the build)"
        required: true
        default: "https://cal.tipline.ai"
      build_api_v2:
        description: "Also build the API v2 image"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  PG_URL: postgresql://unicorn_user:magical_password@localhost:5432/calendso

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unicorn_user
          POSTGRES_PASSWORD: magical_password
          POSTGRES_DB: calendso
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
        with:
          repository: calcom/cal.diy
          ref: ${{ inputs.upstream_ref }}
          path: src
      - id: meta
        run: echo "sha=$(git -C src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web image
        working-directory: src
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/cal-diy-web
          docker build --network host \
            --build-arg NEXT_PUBLIC_WEBAPP_URL=${{ inputs.webapp_url }} \
            --build-arg NEXT_PUBLIC_API_V2_URL=${{ inputs.webapp_url }}/api/v2 \
            --build-arg NEXT_PUBLIC_LICENSE_CONSENT=agree \
            --build-arg CALCOM_TELEMETRY_DISABLED=1 \
            --build-arg DATABASE_URL=$PG_URL \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ steps.meta.outputs.sha }} \
            -t $IMG:${{ steps.meta.outputs.sha }} -t $IMG:latest .
          docker image ls $IMG
          docker push $IMG:${{ steps.meta.outputs.sha }}
          docker push $IMG:latest

  api-v2:
    if: ${{ inputs.build_api_v2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
        with:
          repository: calcom/cal.diy
          ref: ${{ inputs.upstream_ref }}
          path: src
      - id: meta
        run: echo "sha=$(git -C src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API v2 image
        working-directory: src
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/cal-diy-api-v2
          docker build -f apps/api/v2/Dockerfile \
            --build-arg DATABASE_URL=$PG_URL --build-arg DATABASE_DIRECT_URL=$PG_URL \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ steps.meta.outputs.sha }} \
            -t $IMG:${{ steps.meta.outputs.sha }} -t $IMG:latest .
          docker image ls $IMG
          docker push $IMG:${{ steps.meta.outputs.sha }}
          docker push $IMG:latest
